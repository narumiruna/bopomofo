[workspace]
members = ["crates/ime-core", "crates/ime-ffi", "crates/ime-cli", "platforms/windows"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
repository = "https://github.com/narumiruna/bopomofo"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ime-core = { path = "crates/ime-core" }
sha2 = "0.10"

[profile.release]
panic = "unwind"
