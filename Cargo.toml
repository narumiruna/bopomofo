[workspace]
members = ["crates/ime-core", "crates/ime-ffi", "crates/ime-cli", "crates/ime-test-support", "platforms/windows"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
repository = "https://github.com/narumiruna/bopomofo"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ime-core = { path = "crates/ime-core" }
ime-test-support = { path = "crates/ime-test-support" }
sha2 = "0.10"
chewing = { version = "=0.13.1", default-features = false }
log = { version = "0.4", features = ["max_level_off"] }

[profile.release]
panic = "unwind"
