# Native build/tests only. No registration, activation, or desktop input.
name: Windows TSF build and non-registration tests
on:
  push:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows.yml'
      - 'platforms/windows/**'
      - 'crates/ime-core/**'
      - 'fixtures/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
permissions:
  contents: read
jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-2022
            target: i686-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust tools and target
        shell: pwsh
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add '${{ matrix.target }}' --toolchain 1.92.0
      - name: Record build environment
        shell: pwsh
        run: |
          rustc -Vv
          cargo -V
          [Environment]::OSVersion.VersionString
          [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
      - name: Native build and tests without installation
        shell: pwsh
        run: ./platforms/windows/scripts/Build-Test.ps1 -Target '${{ matrix.target }}'
      # No upload, registration, activation, registry change, or desktop smoke
      # test is authorized by this workflow. Record those results separately.
