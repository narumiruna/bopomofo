name: Core and native build checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build host Windows DLL for loader tests
        if: runner.os == 'Windows'
        run: cargo build -p ime-windows --locked
      - run: cargo test --workspace --all-targets --locked
      - name: macOS bundle and adapter contracts
        if: runner.os == 'macOS'
        run: bash platforms/macos/scripts/test.sh
      - name: Windows DLL and non-registration tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./platforms/windows/scripts/Build-Test.ps1 -Target x86_64-pc-windows-msvc

  fcitx5:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build isolated Linux environment
        run: docker build -t bopomofo-fcitx5-check -f platforms/linux/fcitx5/ci/Dockerfile platforms/linux/fcitx5/ci
      - name: Fcitx5 build, ABI and headless contracts
        run: docker run --rm --mount "type=bind,source=$PWD,target=/src,readonly" bopomofo-fcitx5-check

# This workflow does not install/register/enable the IME, run a desktop
# session, publish artifacts, or establish application compatibility.
