name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Validate tag and workspace versions
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: bash .github/scripts/validate-release-tag.sh

  checks:
    needs: validate-tag
    uses: ./.github/workflows/checks.yml

  windows:
    needs: validate-tag
    uses: ./.github/workflows/windows.yml

  draft:
    needs: [checks, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create source-only draft prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/create-source-draft.sh

# Draft creation is not publication approval. Do not attach native binaries,
# install/register/enable an IME, or infer OS/application support from CI.
